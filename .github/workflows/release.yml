name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build app
        run: |
          swift build -c release
          mkdir -p build/PingMaster.app/Contents/MacOS
          mkdir -p build/PingMaster.app/Contents/Resources
          cp .build/release/PingMaster build/PingMaster.app/Contents/MacOS/PingMaster
          cp Resources/Info.plist build/PingMaster.app/Contents/Info.plist

      - name: Create DMG
        run: |
          mkdir -p dmg_tmp
          cp -r build/PingMaster.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create \
            -volname "PingMaster" \
            -srcfolder dmg_tmp \
            -ov \
            -format UDZO \
            PingMaster.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: PingMaster.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
